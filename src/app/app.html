<main class="preview">
  <h1 class="preview__title">Buzzer design system</h1>

  <section class="preview__section">
    <h2 class="preview__heading">Buttons</h2>
    <div class="preview__row">
      <app-button>Button</app-button>
      <app-button icon="ic_external_link">Button</app-button>
      <app-button [disabled]="true">Button</app-button>
      <app-button variant="outline">Button</app-button>
      <app-button variant="outline" icon="ic_external_link">Button</app-button>
      <app-button variant="outline" [disabled]="true">Button</app-button>
    </div>
    <div class="preview__row">
      <app-button size="small">Button</app-button>
      <app-button size="small" [disabled]="true">Button</app-button>
      <app-button size="small" variant="outline">Button</app-button>
      <app-button size="small" variant="outline" [disabled]="true">Button</app-button>
    </div>
  </section>

  <section class="preview__section">
    <h2 class="preview__heading">Inputs</h2>
    <div class="preview__inputs">
      <app-text-input placeholder="Placeholder" message="Message" [(ngModel)]="email" />
      <app-text-input placeholder="Placeholder" status="valid" message="Message" />
      <app-text-input placeholder="Placeholder" status="invalid" message="Message" />
      <app-text-input placeholder="Placeholder" error="Message" />
      <app-text-input placeholder="Placeholder" [ngModel]="''" [disabled]="true" />
    </div>
  </section>

  <section class="preview__section">
    <h2 class="preview__heading">Tags, tabs and segmented button</h2>
    <div class="preview__row">
      <app-tag icon="❤️" [selected]="tagSelected()" (selectedChange)="tagSelected.set($event)">Tag</app-tag>
      <app-tag icon="❤️" [selected]="!tagSelected()" (selectedChange)="tagSelected.set(!$event)">Tag</app-tag>
    </div>
    <app-tabs [tabs]="tabs" [activeId]="activeTab()" (activeIdChange)="activeTab.set($event)" />
    <app-segmented-button
      class="preview__segmented"
      ariaLabel="Example"
      [options]="segments"
      [value]="segment()"
      (valueChange)="segment.set($event)"
    />
  </section>

  <section class="preview__section">
    <h2 class="preview__heading">Dialog</h2>
    <div class="preview__row">
      <app-button (clicked)="dialogOpen.set(true)">Open dialog</app-button>
    </div>
    <app-dialog
      heading="Some Title that goes here"
      description="Further description on what actually this dialog is."
      primaryLabel="Button"
      secondaryLabel="Button"
      [open]="dialogOpen()"
      (primary)="dialogOpen.set(false)"
      (secondary)="dialogOpen.set(false)"
      (closed)="dialogOpen.set(false)"
    />
  </section>
</main>
