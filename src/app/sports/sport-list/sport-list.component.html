<div class="sport-list">
  <div class="sport-list__toolbar">
    <app-breadcrumbs [items]="breadcrumbs" />
    @if (canEdit()) {
      <app-button variant="outline" size="small" icon="ic_add" (clicked)="openAdd()">Add Sport</app-button>
    }
  </div>

  <section class="sport-list__stats" aria-label="Catalogue totals">
    <app-stat-card label="Sports" [value]="totals.value()?.sports ?? null" [loading]="totals.loading()" />
    <app-stat-card
      label="Governing Bodies"
      [value]="totals.value()?.governingBodies ?? null"
      [loading]="totals.loading()"
    />
    <app-stat-card label="Organisations" [value]="totals.value()?.organisations ?? null" [loading]="totals.loading()" />
    <app-stat-card label="Participants" [value]="totals.value()?.participants ?? null" [loading]="totals.loading()" />
  </section>

  @if (list.failed()) {
    <div class="sport-list__error" role="alert">
      <span>Couldn't load the sports. Please try again.</span>
      <app-button variant="outline" size="small" (clicked)="retry()">Try again</app-button>
    </div>
  }

  <app-sports-table
    [sports]="list.rows()"
    [canEdit]="canEdit()"
    [sortBy]="list.query().sortBy"
    [sortOrder]="list.query().sortOrder"
    [loading]="list.loading()"
    [skeletonRowCount]="pageSize"
    [emptyMessage]="emptyMessage()"
    (sortByName)="cycleNameSort()"
    (edit)="openEdit($event)"
    (remove)="askToDelete($event)"
  />

  @if (list.total() > 0) {
    <app-pagination
      [page]="list.query().page"
      [pageSize]="pageSize"
      [total]="list.total()"
      (pageChange)="list.goToPage($event)"
    />
  }
</div>

<app-sport-form-dialog
  [open]="formOpen()"
  [sport]="editing()"
  [saving]="isSaving()"
  [error]="actionError()"
  (save)="saveSport($event)"
  (cancelled)="closeForm()"
/>

<app-dialog
  icon="ic_delete"
  primaryLabel="Delete"
  secondaryLabel="Cancel"
  [open]="!!deleting()"
  [heading]="'Delete ' + (deleting()?.name ?? '') + '?'"
  description="It disappears from every list for the whole team. Its name stays reserved."
  [primaryDisabled]="isSaving()"
  (primary)="deleteSport()"
  (secondary)="cancelDelete()"
  (closed)="cancelDelete()"
>
  @if (actionError(); as message) {
    <p class="sport-list__dialog-error" role="alert">{{ message }}</p>
  }
</app-dialog>
