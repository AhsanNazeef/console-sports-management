<div class="detail-page">
  <app-breadcrumbs [items]="breadcrumbs()" [skipLocationChange]="true" />

  @if (notFound()) {
    <div class="detail-page__missing" role="alert">
      <span>This participant doesn't exist here or has been deleted.</span>
      <a [routerLink]="organisationLink()" skipLocationChange>Back to the organisation</a>
    </div>
  } @else {
    @if (loadError(); as message) {
      <div class="detail-page__error" role="alert">
        <span>{{ message }}</span>
        <app-button variant="outline" size="small" (clicked)="participant.reload()">Try again</app-button>
      </div>
    } @else {
      <app-detail-header
        layout="stacked"
        [title]="fullName()"
        [seed]="participantId()"
        [fields]="fields()"
        [loading]="!participant.value()"
      />
    }
  }
</div>
