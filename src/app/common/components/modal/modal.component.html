@if (open()) {
  <button type="button" class="modal-backdrop" tabindex="-1" aria-label="Close dialog" (click)="closed.emit()"></button>
  <section class="modal" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">
    <header class="modal__header">
      <h2 class="modal__title" [id]="titleId">{{ heading() }}</h2>
      <button type="button" class="modal__close" aria-label="Close" (click)="closed.emit()">
        <img src="assets/icons/ic_close.svg" width="24" height="24" alt="" aria-hidden="true" />
      </button>
    </header>
    <ng-content />
  </section>
}
