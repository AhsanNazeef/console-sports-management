<div class="shell" [class.shell--phone]="isPhone()" [class.shell--drawer-open]="showDrawer()">
  <app-sidebar
    class="shell__sidebar"
    [groups]="navGroups()"
    [collapsed]="!isPhone() && sidebarCollapsed()"
    [userEmail]="userEmail()"
    (collapsedChange)="onSidebarCollapsedChange($event)"
    (itemSelected)="closeDrawer()"
    (signOut)="onSignOut()"
  />
  @if (showDrawer()) {
    <button
      type="button"
      class="shell__backdrop"
      tabindex="-1"
      aria-label="Close menu"
      (click)="closeDrawer()"
    ></button>
  }
  <div class="shell__main">
    <app-header
      [heading]="pageTitle()"
      [searchQuery]="searchQuery()"
      [showMenuButton]="isPhone()"
      (menuClicked)="drawerOpen.set(true)"
      (searchQueryChange)="onSearchQueryChange($event)"
    />
    @if (accessErrorMessage(); as message) {
      <div class="shell__notice" role="alert">
        <span>{{ message }}</span>
        <app-button variant="outline" size="small" [disabled]="reloadingAccess()" (clicked)="reloadAccess()">
          {{ reloadingAccess() ? 'Loading…' : 'Try again' }}
        </app-button>
      </div>
    }
    @if (notice(); as message) {
      <div class="shell__notice" role="alert">
        <span>{{ message }}</span>
        <app-button variant="outline" size="small" (clicked)="dismissNotice()">Dismiss</app-button>
      </div>
    }
    <main class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
